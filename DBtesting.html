<!DOCTYPE html>
<html>
<head>
    <title>the code for the connection of the database</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
    <button onclick="sendSolarData()">Send Solar Data</button>

    <script>
        // Your Firebase configuration (same as Python project)
        const firebaseConfig = {
            apiKey: "AIzaSyDM_St_gvOpRPpUbUTot0aVJwhpkqGT1bM",
            authDomain: "senior-project-a0b32.firebaseapp.com",
            databaseURL: "https://senior-project-a0b32-default-rtdb.firebaseio.com",
            projectId: "senior-project-a0b32",
            storageBucket: "senior-project-a0b32.firebasestorage.app",
            messagingSenderId: "237286209534",
            appId: "1:237286209534:web:9cb12721a31406382bf2af",
            measurementId: "G-T2DTQ8SF6H"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendSolarData() {
            // Create database reference (same path as Python code)
            const ref = database.ref('solar_panal');
            
            // Create data object with server timestamp
            const newData = {
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                efficiency: 8522.6,
                wind_speed: 12.3
            };

            // Push data to Firebase
            ref.push(newData)
                .then(() => {
                    console.log('Data pushed successfully:');
                    console.log(newData);
                })
                .catch((error) => {
                    console.error('Error pushing data:', error);
                });
        }
    </script>
</body>
</html>
