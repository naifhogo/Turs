<!-- contact.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Solar Panels Optimization</title>
    <link rel="stylesheet" href="/CSS files/global.css" />
    <style>
       

        body {
            line-height: 1.6;
            color: var(--text-color);
        }

        .hero-section {
            padding: 6rem 1rem;
            background: linear-gradient(to bottom right, var(--primary-color), var(--secondary-color));
            color: var(--white-color);
            text-align: center;
            position: relative;
            margin-top: 4.5rem;
        }

        .content-section {
            max-width: var(--max-width);
            margin: 2rem auto;
            padding: 2rem;
        }

        .contact-card {
            background: var(--white-color);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            transform: translateY(20px);
            opacity: 0;
            animation: fade-in-up 0.8s forwards;
        }

        .contact-form {
            display: grid;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input, textarea {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            transition: border-color var(--transition-speed);
        }

        input:focus, textarea:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: var(--white-color);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow var(--transition-speed);
        }

        button:hover {
            box-shadow: 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
        }

        .contact-info {
            text-align: center;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        @keyframes fade-in-up {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .content-section {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">SolarWinds</div>
        <nav class="navbar">
          <ul class="nav-menu" id="navMenu">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="dashboard.html" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
              <a href="FAQs.html" class="nav-link">FAQ</a>
            </li>
            <li class="nav-item">
              <a href="support.html" class="nav-link">Support</a>
            </li>
          </ul>
          <div class="hamburger" id="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
        </nav>
      </header>
    
    <header class="hero-section">
        <h1 class="hero-title">Contact Us</h1>
    </header>

    <main class="content-section">
        <div class="contact-card" style="animation-delay: 0.4s">
            <form class="contact-form" action="https://formspree.io/f/mrbqqzeg" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="_replyto" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </div>

        <div class="contact-card" style="animation-delay: 0.6s">
            <div class="contact-info">
                <h2>Direct Contact</h2>
                <p>Email: <a href="mailto:SolarWindsTeam22@gmail.com">SolarWindsTeam22@gmail.com</a></p>
                <p>Phone: +966592730067</p>
                
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
          <div class="footer-links">
            <a href="about.html">About Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="contact.html">Contact</a>
          </div>
          <div class="footer-social">
            <a href="" aria-label="Instagram">  
              <img src="Instagram_icon.png.png" alt="" width="24" height="24" style="vertical-align: middle;"></a>
            <a href="#" aria-label="Twitter">
              <img src="x.png" alt="" width="24" height="24" style="vertical-align: middle;">
            </a>
            <a href="#" aria-label="LinkedIn">
              <img src="LinkedIn_logo_initials.png" alt="" width="24" height="24" style="vertical-align: middle;">
            </a>
          </div>
        </div>
        <p class="footer-copy">
          &copy; 2025 SolarMonitor. All rights reserved.
        </p>
      </footer>
      <script>    document.addEventListener('DOMContentLoaded', () => {
        const hamburger = document.getElementById('hamburger');
        const navMenu   = document.getElementById('navMenu');
        hamburger.addEventListener('click', () => {
          navMenu.classList.toggle('open');
      })});</script>
</body>
</html>
